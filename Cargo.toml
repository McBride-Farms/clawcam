[package]
name = "clawcam"
version = "0.5.15"
edition = "2024"
description = "AI-powered camera monitoring for Raspberry Pi with YOLO detection, object tracking, and adaptive events"
license = "MIT"

[[bin]]
name = "clawcam"
path = "src/main.rs"

# Optional off-device YOLO worker. Pulls RTSP from mediamtx and POSTs
# detections to clawcam-app's webhook. Built by default with
# `cargo build`; deployers who don't want it can `cargo build --bin clawcam`.
[[bin]]
name = "offdevice-yolo"
path = "src/bin/offdevice-yolo/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
chrono = "0.4"
dirs = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs"] }
image = "0.25"
ndarray = "0.17"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
